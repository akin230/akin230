<style>
  body {
    margin: 0;
    background: #121212;
    color: #eee;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  header {
    background-color: #111;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.7);
    gap: 16px;
  }
  header a.logo-link img {
    height: 48px;
    filter: drop-shadow(0 0 3px #0f62fe);
    transition: transform 0.3s ease;
  }
  header a.logo-link:hover img {
    transform: scale(1.1);
  }

  .running-text-container {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    position: relative;
    height: 48px;
  }
  .running-text {
  	
    display: inline-block;
    padding-left: 100%;
    animation: marquee 15s linear infinite;
    font-size: 20px;
    font-weight: 600;
    color: #ffffff;
    user-select: none;
    text-shadow: 0 0 5px #0f62fe99;
    line-height: 48px;
  }
  @keyframes marquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }

  #horizontalMenu {
    background-color: #222;
    padding: 8px 16px;
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
  }
  #horizontalMenu a.icon-link img {
    width: 32px;
    height: 32px;
    object-fit: contain;
    transition: transform 0.3s ease, filter 0.3s ease;
    filter: none;
  }
  #horizontalMenu a.icon-link:hover img {
    transform: scale(1.1);
    filter: drop-shadow(0 0 5px #1e90ff);
  }

  #videoPlayer {
    width: 90%;
    max-width: 900px;
    height: 506px;
    margin: 20px auto 10px;
    display: block;
    border-radius: 8px;
    background: black;
    box-shadow: 0 0 20px #0f62fe99;
  }

  /* ปรับเป็นกริด 4 คอลัมน์สำหรับช่องรายการ */
  #channelList {
    width: 90%;
    max-width: 900px;
    margin: 0 auto 30px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
  }
  .channel-item {
    cursor: pointer;
    background: #222;
    border-radius: 8px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: inset 0 0 5px transparent;
    transition: background-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
    user-select: none;
    outline-offset: 4px;
  }
  .channel-item:hover,
  .channel-item:focus {
    background-color: #0f62fe;
    box-shadow: 0 0 15px #1e90ff;
    transform: scale(1.05);
    outline: none;
  }
  .channel-item.active {
    background-color: #005fcc;
    box-shadow: 0 0 20px #3ea0ff;
    transform: scale(1.07);
  }
  .channel-item img {
    width: 70px;
    height: 40px;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 0 8px rgba(0,0,0,0.5);
  }
  .channel-name {
    font-size: 18px;
    font-weight: 700;
    color: #eee;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

#slideShow {
  width: 90%;
  max-width: 900px;
  margin: 0 auto 50px;
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding: 16px;
  border-radius: 12px;
  background: rgba(18, 18, 18, 0.4);
  backdrop-filter: blur(5px);
}

#slideShow a {
  display: block;
  width: 220px;
  height: 124px;
  border-radius: 10px;
  overflow: hidden;
  flex-shrink: 0;
  position: relative;
}

#slideShow a img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: fit; /* สำคัญ: ตัดภาพให้พอดี */
  border-radius: 10px;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  box-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
}

#slideShow a img:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px #1e90ff;
}


  #channelList::-webkit-scrollbar,
  #slideShow::-webkit-scrollbar {
    height: 8px;
  }
  #channelList::-webkit-scrollbar-thumb,
  #slideShow::-webkit-scrollbar-thumb {
    background-color: #0f62fe99;
    border-radius: 4px;
  }
  #channelList::-webkit-scrollbar-track,
  #slideShow::-webkit-scrollbar-track {
    background-color: transparent;
  }

  @media (max-width: 600px) {
    #videoPlayer {
      width: 100%;
      height: 280px;
    }
    .channel-item {
      padding: 10px;
      gap: 8px;
    }
    .channel-item img {
      width: 50px;
      height: 28px;
    }
    .channel-name {
      font-size: 16px;
    }
    #slideShow a img {
      width: 150px;
      height: 85px;
    }
  }
</style>
</head>
